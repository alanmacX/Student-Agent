events { worker_connections 1024; }

http {
    upstream backend { server backend:8000; }
    upstream frontend { server frontend:80; }

    server {
        listen 80;

        # Force HTTPS at the origin, independent of any CDN vendor. Every CDN /
        # reverse proxy forwards X-Forwarded-Proto with the client-side scheme,
        # so plaintext requests get bounced to HTTPS regardless of what fronts us.
        if ($http_x_forwarded_proto = "http") {
            return 308 https://$host$request_uri;
        }

        # HSTS: the browser remembers "this host is HTTPS-only" — survives a CDN
        # swap. Plus a few generic hardening headers, all emitted at the origin.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Frontend (React SPA)
        location / {
            proxy_pass http://frontend;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # SSE: disable buffering
        location ~ ^/api/.+/chat$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_set_header X-Accel-Buffering no;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
        }

        # SSE: schedule chat
        location ~ ^/api/schedule/chat$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_set_header X-Accel-Buffering no;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding on;
        }

        location /health {
            proxy_pass http://backend;
        }
    }
}
