services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # DingTalk client DB (read-only mount). The *_v3 folder is account-scoped;
      # override via .env if the account changes.
      - DINGTALK_DB_SOURCE=/dingtalk_db/dingtalk.db
    volumes:
      - chatbot_data:/data
      - /root/.config/DingTalk/ec87a3f86468e8572679_v3/DBFiles:/dingtalk_db:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  chatbot_data:
