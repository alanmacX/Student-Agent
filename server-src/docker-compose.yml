services:
  backend:
    image: ghcr.io/alanmacx/student-agent/backend:latest
    build: ./backend
    restart: unless-stopped
    # Cap RAM so a backend leak can't OOM the whole 1.8GB host (kills only this
    # container, which then restarts). memswap defaults to 2x → 512M swap too.
    mem_limit: 512m
    mem_reservation: 256m
    env_file: .env
    environment:
      # Point to the mounted config dir; dingtalk_service.py globs for *_v3/DBFiles/dingtalk.db
      - DINGTALK_DB_SOURCE=/dingtalk_cfg
      # Screenshot helper runs on host port 7777; backend calls it for QR images
      - DINGTALK_QR_SERVICE=http://host.docker.internal:7777
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - chatbot_data:/data
      # Mount the *entire* DingTalk config dir so we can glob for the account-
      # scoped *_v3 subdirectory without hardcoding the user ID.
      - /root/.config/DingTalk:/dingtalk_cfg:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    image: ghcr.io/alanmacx/student-agent/frontend:latest
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  chatbot_data:
